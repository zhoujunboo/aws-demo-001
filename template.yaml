AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: GitHub profile Hono API, VPC, and Aurora PostgreSQL.

Parameters:
  ProjectName:
    Type: String
    Default: github-profile
    AllowedPattern: "^[a-z][a-z0-9-]*$"
    Description: Prefix used for resource names.
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
  PrivateSubnetACidr:
    Type: String
    Default: 10.0.11.0/24
  PrivateSubnetBCidr:
    Type: String
    Default: 10.0.12.0/24
  BastionAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI.
  BastionInstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
  BastionAllowedSshCidr:
    Type: String
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/(3[0-2]|[12]?[0-9])$'
    Description: Current public IP in CIDR form, for example 203.0.113.10/32.
  DatabaseName:
    Type: String
    Default: githubprofile
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9]*$"
  DatabaseUsername:
    Type: String
    Default: postgres
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
  AuroraMinCapacity:
    Type: Number
    Default: 0.5
  AuroraMaxCapacity:
    Type: Number
    Default: 1
  CorsOrigin:
    Type: String
    Default: https://frosty-meadow-9529.junbozhou88.workers.dev
    Description: Exact frontend origin allowed by Hono CORS.
  BetterAuthUrl:
    Type: String
    Default: https://21y24vyexa.execute-api.us-east-1.amazonaws.com
    Description: Backend public URL. Update this to ApiUrl after the first deployment.
  ProfileServiceImageUri:
    Type: String
    Description: Versioned ECR image URI for the Go profile service, including its tag or digest.
Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    MemorySize: 512
    PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess"
    Timeout: 30
    Tracing: Active
    Tags:
      Project: !Ref ProjectName
      Environment: !Ref EnvironmentName

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-igw"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public-a"

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnetACidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-private-a"

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnetBCidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-private-b"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public-rt"

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  NatElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-nat-eip"

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatElasticIp.AllocationId
      ConnectivityType: public
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-nat-a"

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-private-rt"

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
      RouteTableId: !Ref PrivateRouteTable

  PrivateRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetA

  PrivateRouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetB

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the Hono Lambda function.
      GroupName: !Sub "${ProjectName}-${EnvironmentName}-lambda-sg"
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: "-1"
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-lambda-sg"

  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the database bastion host.
      GroupName: !Sub "${ProjectName}-${EnvironmentName}-bastion-sg"
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: "-1"
      SecurityGroupIngress:
        - CidrIp: !Ref BastionAllowedSshCidr
          Description: SSH from the current administrator IP
          FromPort: 22
          IpProtocol: tcp
          ToPort: 22
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-bastion-sg"

  BastionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BastionRole

  BastionHost:
    Type: AWS::EC2::Instance
    DependsOn: PublicDefaultRoute
    Properties:
      IamInstanceProfile: !Ref BastionInstanceProfile
      ImageId: !Ref BastionAmiId
      InstanceType: !Ref BastionInstanceType
      MetadataOptions:
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 2
        HttpTokens: required
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeleteOnTermination: true
          DeviceIndex: "0"
          GroupSet:
            - !Ref BastionSecurityGroup
          SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-bastion"

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL only from the Lambda security group.
      GroupName: !Sub "${ProjectName}-${EnvironmentName}-database-sg"
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: "-1"
      SecurityGroupIngress:
        - Description: PostgreSQL from Lambda
          FromPort: 5432
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          ToPort: 5432
        - Description: PostgreSQL from the Go profile service
          FromPort: 5432
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref ProfileServiceSecurityGroup
          ToPort: 5432
        - Description: PostgreSQL from bastion
          FromPort: 5432
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref BastionSecurityGroup
          ToPort: 5432
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-database-sg"

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for Aurora PostgreSQL.
      DBSubnetGroupName: !Sub "${ProjectName}-${EnvironmentName}-db-subnets"
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-db-subnets"

  DatabaseCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      DatabaseName: !Ref DatabaseName
      DBClusterIdentifier: !Sub "${ProjectName}-${EnvironmentName}-cluster"
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DeletionProtection: false
      Engine: aurora-postgresql
      EngineMode: provisioned
      EngineVersion: "17.7"
      ManageMasterUserPassword: true
      MasterUsername: !Ref DatabaseUsername
      Port: 5432
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref AuroraMinCapacity
        MaxCapacity: !Ref AuroraMaxCapacity
      StorageEncrypted: true
      VpcSecurityGroupIds:
        - !Ref DatabaseSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-cluster"

  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      AutoMinorVersionUpgrade: true
      DBClusterIdentifier: !Ref DatabaseCluster
      DBInstanceClass: db.serverless
      DBInstanceIdentifier: !Sub "${ProjectName}-${EnvironmentName}-cluster-instance-1"
      Engine: aurora-postgresql
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-cluster-instance-1"

  BetterAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Better Auth signing secret for the Hono API.
      GenerateSecretString:
        ExcludePunctuation: true
        GenerateStringKey: secret
        PasswordLength: 48
        SecretStringTemplate: '{"purpose":"better-auth"}'
      Name: !Sub "${ProjectName}/${EnvironmentName}/better-auth"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ProfileServiceLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow the Hono Lambda function to reach the internal profile service ALB.
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: "-1"
      SecurityGroupIngress:
        - Description: HTTP from the Hono Lambda function
          FromPort: 80
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          ToPort: 80
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-profile-alb-sg"

  ProfileServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow the internal profile service ALB to reach Fargate tasks.
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: "-1"
      SecurityGroupIngress:
        - Description: HTTP from the internal profile service ALB
          FromPort: 8080
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref ProfileServiceLoadBalancerSecurityGroup
          ToPort: 8080
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-profile-service-sg"

  ProfileServiceLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-${EnvironmentName}-profile-service"
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ProfileServiceCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-${EnvironmentName}-profile-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ProfileServiceTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-profile-task-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess"
      Policies:
        - PolicyName: ReadAuroraMasterSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ProfileServiceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: "256"
      ExecutionRoleArn: !GetAtt ProfileServiceTaskExecutionRole.Arn
      Family: !Sub "${ProjectName}-${EnvironmentName}-profile-service"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: profile-service
          Essential: true
          Image: !Ref ProfileServiceImageUri
          PortMappings:
            - AppProtocol: http
              ContainerPort: 8080
              Name: http-8080-tcp
              Protocol: tcp
          Environment:
            - Name: CORS_ORIGIN
              Value: !Ref CorsOrigin
            - Name: DATABASE_HOST
              Value: !GetAtt DatabaseCluster.Endpoint.Address
            - Name: DATABASE_MAX_CONNECTIONS
              Value: "5"
            - Name: DATABASE_NAME
              Value: !Ref DatabaseName
            - Name: DATABASE_PORT
              Value: !GetAtt DatabaseCluster.Endpoint.Port
            - Name: DATABASE_SSLMODE
              Value: require
            - Name: PORT
              Value: "8080"
          Secrets:
            - Name: DATABASE_PASSWORD
              ValueFrom: !Sub "${DatabaseCluster.MasterUserSecret.SecretArn}:password::"
            - Name: DATABASE_USERNAME
              ValueFrom: !Sub "${DatabaseCluster.MasterUserSecret.SecretArn}:username::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ProfileServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
              mode: blocking
          ReadonlyRootFilesystem: true
          StopTimeout: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ProfileServiceLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      IpAddressType: ipv4
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: "false"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Name: !Sub "${ProjectName}-${EnvironmentName}-profile-alb"
      Scheme: internal
      SecurityGroups:
        - !Ref ProfileServiceLoadBalancerSecurityGroup
      Subnets:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      Type: application
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ProfileServiceTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /healthz
      HealthCheckPort: traffic-port
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      Name: !Sub "${ProjectName}-${EnvironmentName}-profile-tg"
      Port: 8080
      Protocol: HTTP
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "60"
      TargetType: ip
      UnhealthyThresholdCount: 2
      VpcId: !Ref Vpc
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ProfileServiceListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ProfileServiceTargetGroup
      LoadBalancerArn: !Ref ProfileServiceLoadBalancer
      Port: 80
      Protocol: HTTP

  ProfileService:
    Type: AWS::ECS::Service
    DependsOn:
      - DatabaseInstance
      - ProfileServiceListener
    Properties:
      Cluster: !Ref ProfileServiceCluster
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      DesiredCount: 1
      EnableECSManagedTags: true
      HealthCheckGracePeriodSeconds: 60
      LaunchType: FARGATE
      LoadBalancers:
        - ContainerName: profile-service
          ContainerPort: 8080
          TargetGroupArn: !Ref ProfileServiceTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref ProfileServiceSecurityGroup
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
      PlatformVersion: LATEST
      PropagateTags: SERVICE
      ServiceName: !Sub "${ProjectName}-${EnvironmentName}-profile-service"
      TaskDefinition: !Ref ProfileServiceTaskDefinition
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ProfileEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Profile generation events
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
      TopicName: !Sub "${ProjectName}-${EnvironmentName}-profile-events"

  ProfileGenerationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      QueueName: !Sub "${ProjectName}-${EnvironmentName}-profile-generation-dlq"
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ProfileGenerationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${EnvironmentName}-profile-generation-jobs"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProfileGenerationDeadLetterQueue.Arn
        maxReceiveCount: 3
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
      VisibilityTimeout: 180

  ProfileGenerationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowProfileEventsTopic
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ProfileGenerationQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref ProfileEventsTopic
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Queues:
        - !Ref ProfileGenerationQueue

  ProfileGenerationSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: ProfileGenerationQueuePolicy
    Properties:
      Endpoint: !GetAtt ProfileGenerationQueue.Arn
      Protocol: sqs
      RawMessageDelivery: true
      TopicArn: !Ref ProfileEventsTopic

  CanaryArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldCanaryArtifacts
            Status: Enabled
            ExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ApiReadinessCanaryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess"
      Policies:
        - PolicyName: RunApiReadinessCanary
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt CanaryArtifactsBucket.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${CanaryArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListAllMyBuckets
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cwsyn-*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: CloudWatchSynthetics
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: Public HTTP API for the Hono Lambda application.
      FailOnWarnings: true
      Name: !Sub "${ProjectName}-${EnvironmentName}-api"
      StageName: $default
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref EnvironmentName

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - ProfileService
    Properties:
      CodeUri: apps/server/dist/lambda/
      Description: Hono API connected to Aurora PostgreSQL.
      Environment:
        Variables:
          BETTER_AUTH_SECRET: !Sub "{{resolve:secretsmanager:${BetterAuthSecret}:SecretString:secret}}"
          BETTER_AUTH_URL: !Ref BetterAuthUrl
          CORS_ORIGIN: !Ref CorsOrigin
          DATABASE_HOST: !GetAtt DatabaseCluster.Endpoint.Address
          DATABASE_NAME: !Ref DatabaseName
          DATABASE_PASSWORD: !Sub "{{resolve:secretsmanager:${DatabaseCluster.MasterUserSecret.SecretArn}:SecretString:password}}"
          DATABASE_PORT: !GetAtt DatabaseCluster.Endpoint.Port
          DATABASE_USERNAME: !Ref DatabaseUsername
          NODE_ENV: production
          PROFILE_EVENTS_TOPIC_ARN: !Ref ProfileEventsTopic
          PROFILE_SERVICE_URL: !Sub "http://${ProfileServiceLoadBalancer.DNSName}"
      Events:
        ProxyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: ANY
            Path: /{proxy+}
        RootRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: ANY
            Path: /
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-api"
      Handler: lambda.handler
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ProfileEventsTopic.TopicName
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB

  ApiReadinessCanary:
    Type: AWS::Synthetics::Canary
    DependsOn: ApiFunction
    Properties:
      ArtifactS3Location: !Sub "s3://${CanaryArtifactsBucket}/api-readiness"
      Code:
        Handler: index.handler
        Script: |
          const synthetics = require("Synthetics");
          const log = require("SyntheticsLogger");

          const checkEndpoint = async (path) => {
            const url = process.env.API_BASE_URL + path;
            const page = await synthetics.getPage();
            const response = await page.goto(url, {
              timeout: 30000,
              waitUntil: "domcontentloaded",
            });
            if (!response) {
              throw new Error("No response received from " + path);
            }
            const status = response.status();
            log.info(path + " returned HTTP " + status);
            if (status < 200 || status >= 300) {
              throw new Error(path + " returned HTTP " + status);
            }
          };

          exports.handler = async () => {
            await checkEndpoint("/healthz");
            await checkEndpoint("/readyz");
          };
      ExecutionRoleArn: !GetAtt ApiReadinessCanaryRole.Arn
      FailureRetentionPeriod: 31
      Name: !Sub "${ProjectName}-${EnvironmentName}-api-readiness"
      ProvisionedResourceCleanup: AUTOMATIC
      RunConfig:
        ActiveTracing: false
        EnvironmentVariables:
          API_BASE_URL: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
        MemoryInMB: 1500
        TimeoutInSeconds: 60
      RuntimeVersion: syn-nodejs-puppeteer-17.0
      Schedule:
        DurationInSeconds: 0
        Expression: rate(5 minutes)
      StartCanaryAfterCreation: true
      SuccessRetentionPeriod: 31
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ProfileGenerationWorkerFunction:
    Type: AWS::Serverless::Function
    DependsOn: ProfileService
    Properties:
      CodeUri: apps/server/dist/lambda/
      Description: Consumes queued profile generation tasks and calls the Go profile service.
      Environment:
        Variables:
          BETTER_AUTH_SECRET: !Sub "{{resolve:secretsmanager:${BetterAuthSecret}:SecretString:secret}}"
          BETTER_AUTH_URL: !Ref BetterAuthUrl
          CORS_ORIGIN: !Ref CorsOrigin
          DATABASE_HOST: !GetAtt DatabaseCluster.Endpoint.Address
          DATABASE_NAME: !Ref DatabaseName
          DATABASE_PASSWORD: !Sub "{{resolve:secretsmanager:${DatabaseCluster.MasterUserSecret.SecretArn}:SecretString:password}}"
          DATABASE_PORT: !GetAtt DatabaseCluster.Endpoint.Port
          DATABASE_USERNAME: !Ref DatabaseUsername
          NODE_ENV: production
          PROFILE_SERVICE_URL: !Sub "http://${ProfileServiceLoadBalancer.DNSName}"
      Events:
        ProfileGenerationQueueEvent:
          Type: SQS
          Properties:
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            Queue: !GetAtt ProfileGenerationQueue.Arn
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-profile-generation-worker"
      Handler: profile-generation-worker.handler
      Policies:
        - AWSLambdaVPCAccessExecutionRole
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB

  MigrationFunction:
    Type: AWS::Serverless::Function
    DependsOn: DatabaseInstance
    Properties:
      CodeUri: apps/server/dist/lambda/
      Description: Applies pending Drizzle migrations to Aurora PostgreSQL.
      Environment:
        Variables:
          DATABASE_HOST: !GetAtt DatabaseCluster.Endpoint.Address
          DATABASE_NAME: !Ref DatabaseName
          DATABASE_PASSWORD: !Sub "{{resolve:secretsmanager:${DatabaseCluster.MasterUserSecret.SecretArn}:SecretString:password}}"
          DATABASE_PORT: !GetAtt DatabaseCluster.Endpoint.Port
          DATABASE_USERNAME: !Ref DatabaseUsername
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-migration"
      Handler: migration.handler
      Policies:
        - AWSLambdaVPCAccessExecutionRole
      Timeout: 300
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB

Outputs:
  ApiUrl:
    Description: Use this value as BetterAuthUrl after the first deployment.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  ApiFunctionName:
    Value: !Ref ApiFunction
  ApiReadinessCanaryName:
    Value: !Ref ApiReadinessCanary
  AuroraEndpoint:
    Value: !GetAtt DatabaseCluster.Endpoint.Address
  BastionInstanceId:
    Value: !Ref BastionHost
  BastionPublicIp:
    Value: !GetAtt BastionHost.PublicIp
  CanaryArtifactsBucketName:
    Value: !Ref CanaryArtifactsBucket
  DatabaseSecretArn:
    Value: !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
  MigrationFunctionName:
    Value: !Ref MigrationFunction
  ProfileEventsTopicArn:
    Value: !Ref ProfileEventsTopic
  ProfileGenerationDeadLetterQueueUrl:
    Value: !Ref ProfileGenerationDeadLetterQueue
  ProfileGenerationQueueUrl:
    Value: !Ref ProfileGenerationQueue
  ProfileGenerationWorkerFunctionName:
    Value: !Ref ProfileGenerationWorkerFunction
  ProfileServiceClusterName:
    Value: !Ref ProfileServiceCluster
  ProfileServiceLoadBalancerDnsName:
    Value: !GetAtt ProfileServiceLoadBalancer.DNSName
  ProfileServiceName:
    Value: !GetAtt ProfileService.Name
  ProfileServiceUrl:
    Value: !Sub "http://${ProfileServiceLoadBalancer.DNSName}"
  PrivateSubnetAId:
    Value: !Ref PrivateSubnetA
  PrivateSubnetBId:
    Value: !Ref PrivateSubnetB
  VpcId:
    Value: !Ref Vpc
