name: Pull request preview

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CLOUDFLARE_WORKERS_SUBDOMAIN: junbozhou88
  CODEBUILD_PROJECT_NAME: github-profile-pr-preview
  PREVIEW_ROLE_ARN: arn:aws:iam::492646066759:role/github-profile-dev-pr-github-actions
  VITE_SERVER_URL: https://vrpywgys31.execute-api.us-east-1.amazonaws.com

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Build and deploy PR preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out pull request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assume preview deployment role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: pr-preview-${{ github.event.pull_request.number }}
          role-to-assume: ${{ env.PREVIEW_ROLE_ARN }}

      - name: Build and deploy Go preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BUILD_ID="$(aws codebuild start-build \
            --project-name "$CODEBUILD_PROJECT_NAME" \
            --source-version "$PR_SHA" \
            --environment-variables-override \
              name=PREVIEW_ACTION,value=deploy,type=PLAINTEXT \
              name=PR_NUMBER,value="$PR_NUMBER",type=PLAINTEXT \
              name=PR_SHA,value="$PR_SHA",type=PLAINTEXT \
            --query 'build.id' \
            --output text)"
          echo "CodeBuild execution: $BUILD_ID"

          while true; do
            BUILD_STATUS="$(aws codebuild batch-get-builds \
              --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' \
              --output text)"
            case "$BUILD_STATUS" in
              SUCCEEDED)
                break
                ;;
              FAILED|FAULT|STOPPED|TIMED_OUT)
                echo "CodeBuild finished with status $BUILD_STATUS."
                exit 1
                ;;
              *)
                echo "CodeBuild status: $BUILD_STATUS"
                sleep 10
                ;;
            esac
          done

      - name: Build frontend for this PR
        env:
          VITE_PREVIEW_ID: pr-${{ github.event.pull_request.number }}
        run: pnpm exec turbo run build --filter=web

      - name: Deploy frontend Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: github-profile-web-pr-${{ github.event.pull_request.number }}
        run: pnpm --dir apps/web exec wrangler deploy --name "$WORKER_NAME"

      - name: Publish preview address
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://github-profile-web-pr-${{ github.event.pull_request.number }}.${{ env.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev
        with:
          script: |
            const marker = "<!-- pr-preview-environment -->";
            const body = [
              marker,
              "PR preview is ready.",
              "",
              `Web: ${process.env.PREVIEW_URL}`,
              "",
              "The Go service is isolated for this PR; data currently uses the shared dev Aurora database.",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const previous = comments.find((comment) =>
              comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  destroy:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Destroy PR preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Assume preview deployment role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: pr-preview-delete-${{ github.event.pull_request.number }}
          role-to-assume: ${{ env.PREVIEW_ROLE_ARN }}

      - name: Delete Go preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BUILD_ID="$(aws codebuild start-build \
            --project-name "$CODEBUILD_PROJECT_NAME" \
            --source-version master \
            --environment-variables-override \
              name=PREVIEW_ACTION,value=delete,type=PLAINTEXT \
              name=PR_NUMBER,value="$PR_NUMBER",type=PLAINTEXT \
              name=PR_SHA,value="$PR_SHA",type=PLAINTEXT \
            --query 'build.id' \
            --output text)"
          echo "CodeBuild execution: $BUILD_ID"

          while true; do
            BUILD_STATUS="$(aws codebuild batch-get-builds \
              --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' \
              --output text)"
            case "$BUILD_STATUS" in
              SUCCEEDED)
                break
                ;;
              FAILED|FAULT|STOPPED|TIMED_OUT)
                echo "CodeBuild finished with status $BUILD_STATUS."
                exit 1
                ;;
              *)
                echo "CodeBuild status: $BUILD_STATUS"
                sleep 10
                ;;
            esac
          done

      - name: Delete frontend Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: github-profile-web-pr-${{ github.event.pull_request.number }}
        run: |
          DELETE_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}?force=true"
          HTTP_STATUS="$(curl --silent --show-error \
            --output cloudflare-delete-response.json \
            --write-out '%{http_code}' \
            --request DELETE \
            --url "$DELETE_URL" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"

          case "$HTTP_STATUS" in
            200)
              echo "Deleted frontend Worker $WORKER_NAME."
              ;;
            404)
              echo "Frontend Worker $WORKER_NAME is already absent."
              ;;
            *)
              echo "Cloudflare Worker deletion failed with HTTP $HTTP_STATUS."
              jq '{errors, messages}' cloudflare-delete-response.json
              exit 1
              ;;
          esac

      - name: Mark preview as removed
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- pr-preview-environment -->";
            const body = [
              marker,
              "PR preview resources have been removed.",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const previous = comments.find((comment) =>
              comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            }
