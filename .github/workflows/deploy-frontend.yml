name: Deploy frontend

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/deploy-frontend.yml"
      - "apps/web/**"
      - "packages/api/**"
      - "packages/config/**"
      - "packages/env/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: true

env:
  VITE_SERVER_URL: https://vrpywgys31.execute-api.us-east-1.amazonaws.com

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    name: Build and deploy static assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm exec turbo run build --filter=web

      - name: Deploy frontend to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --dir apps/web exec wrangler deploy
